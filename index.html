<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Generador de Imágenes IA</title>
<script src="https://www.paypal.com/sdk/js?client-id=AuSDR8Q0aGbM3ToAm70OB0pqhZ_tSQKwT-hUbTbE&currency=USD"></script>
<style>body{font-family:Arial;background:#0f172a;color:white;text-align:center;padding:20px}.container{max-width:500px;margin:auto;background:#1e293b;padding:25px;border-radius:15px}h1{font-size:28px}.subtitulo{color:#94a3b8;margin-bottom:20px}.precio{font-size:20px;font-weight:bold;color:#22c55e}input,button{width:90%;padding:14px;margin:10px;border-radius:8px;border:none}#generateBtn{background:#22c55e;color:white;font-weight:bold}#generateBtn:disabled{background:#475569}img{max-width:100%;margin-top:20px;border-radius:10px}</style></head>
<body><div class="container"><h1>Generador de Imágenes IA</h1><p class="subtitulo">Crea cualquier imagen con IA</p><p class="precio">Solo $5 USD - Pago único</p><input id="prompt" placeholder="Ej: atardecer en Punta del Este"><div id="paypal-button-container"></div><button id="generateBtn" disabled>Generar Imagen</button><div id="result"></div></div>
<script>let pago=false;paypal.Buttons({createOrder:(d,a)=>a.order.create({purchase_units:[{amount:{value:'5.00'}}]}),onApprove:(d,a)=>a.order.capture().then(()=>{alert('¡Pago listo!');pago=true;document.getElementById('generateBtn').disabled=false}),onCancel:()=>alert('Cancelado')}).render('#paypal-button-container');document.getElementById('generateBtn').onclick=()=>{if(!pago)return alert('Paga primero');const p=document.getElementById('prompt').value;if(!p)return alert('Escribe algo');document.getElementById('result').innerHTML='Generando...';const url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=512&height=512`;document.getElementById('result').innerHTML=`<img src="${url}"><br><a href="${url}" download><button style="background:#22c55e">Descargar</button></a>`}</script></body></html>
